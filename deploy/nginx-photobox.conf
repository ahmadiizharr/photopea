# work.mangaisekai.com -> jepret photobox (FastAPI :8090). Lewat Cloudflare (proxied).
# Cloudflare "Always Use HTTPS" aktif, jadi tantangan ACME juga dilayani di :443.

limit_req_zone $binary_remote_addr zone=pb_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pb_all:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pb_login:10m rate=6r/m;

server {
    listen 80;
    server_name work.mangaisekai.com;
    include /etc/nginx/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name work.mangaisekai.com;
    include /etc/nginx/cloudflare-realip.conf;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/work.mangaisekai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work.mangaisekai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;

    # strip + 4 foto ~3 MB; batas per file di backend 8 MB
    client_max_body_size 30m;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Satu sesi = satu unggahan; 10/menit per IP masih longgar untuk booth di acara.
    location = /api/sessions {
        limit_req zone=pb_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Login dashboard: tebak password dibatasi 6/menit per IP.
    location = /api/admin/login {
        limit_req zone=pb_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload frame PNG dari dashboard (maks 20 MB per file di backend).
    location = /api/admin/frames {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Aset hasil build Vite ber-hash -> boleh di-cache selamanya.
    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
    }

    location / {
        limit_req zone=pb_all burst=80 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
