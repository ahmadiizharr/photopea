<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halaman tidak ada — jepret</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <style>
    .nf { min-height: 100dvh; display: grid; place-content: center; gap: 26px; justify-items: start; padding: 32px 16px; max-width: 720px; margin: 0 auto; }
    .nf .num { margin: 0; font: 800 clamp(120px, 26vw, 220px)/.8 var(--display); letter-spacing: -.04em; color: var(--pink); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 8px 8px 0 var(--ink); }
    .nf h1 { margin: 0; font: 800 clamp(30px, 5vw, 48px)/1 var(--display); letter-spacing: -.02em; }
    .nf p { margin: 0; color: var(--ink-2); font-size: 19px; }
    .nf .row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  </style>
</head>
<body>
  <main class="nf">
    <a class="logo" href="/"><span class="logo-mark" aria-hidden="true"></span>jepret</a>
    <p class="num" aria-hidden="true">404</p>
    <h1>Halaman ini kebablasan dipotong.</h1>
    <p>Link-nya mungkin salah, atau halamannya sudah dipindah.</p>
    <div class="row">
      <a class="btn btn-pink" href="/booth/">Buka booth <span class="arr" aria-hidden="true">→</span></a>
      <a class="textlink" href="/">Ke beranda</a>
    </div>
  </main>
</body>
</html>
